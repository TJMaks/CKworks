<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1 id="event-title">Ночь в музее</h1>
    <p>15 ноября, 18:30</p>
    <p>Музей космонавтики, проспект Мира, 111</p>
    <p>Вечерняя программа с выставкой и экскурсиями</p>
    <button id="show-program" type="button">Показать программу</button>
    <div id="program" class="info" hidden></div>
  </div>

  <div id="data-error" class="error" hidden></div>

  <form id="service-form" class="form-box" hidden>
    <h2>Выберите услуги</h2>
    <p><label><input type="checkbox" id="guide"> Экскурсия с гидом</label></p>
    <p><label><input type="checkbox" id="audio"> Аудиогид</label></p>
    <p><label><input type="checkbox" id="catalog"> Каталог выставки</label></p>
    <button type="submit">Рассчитать</button>
  </form>

  <div id="choice-error" class="error" hidden></div>
  <div id="result" class="info" hidden></div>
  <pre id="report-json" class="json" hidden></pre>

  <script src="app.js"></script>
</body>
</html>
